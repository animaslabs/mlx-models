[project]
name = "mlx-models"
version = "0.1.0"
description = "Converts models to MLX format and publish to HuggingFace"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.2.0",
    "mlx>=0.32.3",
    "mlx-audio>=0.5.9",
    "numpy<2.4",
    "parakeet-mlx>=0.5.3",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]
